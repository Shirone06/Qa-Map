<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>แผนที่หน่วยงาน QA</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Sarabun',sans-serif;background:#0f1623;color:white;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,#1a2340,#1e2d4a);padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2a3550;flex-shrink:0}
.header-icon{font-size:22px}
.header-title{font-size:16px;font-weight:700;color:#e2e8f0}
.header-sub{font-size:11px;color:#718096}
.hbadge{margin-left:auto;background:#2d3550;border:1px solid #3a4060;border-radius:20px;padding:4px 14px;font-size:12px;font-weight:700;color:#4299e1;white-space:nowrap}
.toolbar{background:#1a2340;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #2a3550;flex-shrink:0}
.qa-btn{padding:5px 14px;border-radius:20px;border:1px solid #3a4060;background:transparent;color:#a0aec0;font-family:'Sarabun',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.qa-btn:hover{border-color:#718096;color:white}
.qa-btn.active{color:white;border-color:transparent}
.qa-btn[data-qa="all"].active{background:#4a5568}
.qa-btn[data-qa="Qa1"].active{background:#d69e2e}
.qa-btn[data-qa="Qa2"].active{background:#38a169}
.qa-btn[data-qa="Qa3"].active{background:#3182ce}
.qa-btn[data-qa="Ecs"].active{background:#805ad5}
.qa-btn[data-qa="แรงงาน"].active{background:#dd6b20}
.qa-btn[data-qa="Qa4"].active{background:#e53e3e}
.qa-btn[data-qa="Qa5"].active{background:#d53f8c}
.qa-btn[data-qa="Qa6"].active{background:#00b5d8}
.search-wrap{position:relative;flex:1;min-width:160px;max-width:300px}
.search-wrap input{width:100%;padding:6px 32px 6px 12px;background:#2d3550;border:1px solid #3a4060;border-radius:20px;color:white;font-family:'Sarabun',sans-serif;font-size:12px;outline:none}
.search-wrap input::placeholder{color:#718096}
.search-wrap input:focus{border-color:#4299e1}
.search-icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#1e2433;border:1px solid #3a4060;border-radius:10px;max-height:220px;overflow-y:auto;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
.search-item{padding:8px 14px;cursor:pointer;border-bottom:1px solid #2d3550;font-size:12px}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:#2d3550}
.si-code{font-size:10px;font-weight:700}
.si-name{color:#a0aec0;font-size:11px;margin-top:1px}
.add-btn{padding:5px 12px;border-radius:20px;border:1px solid #4299e1;background:transparent;color:#4299e1;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.add-btn:hover{background:#4299e1;color:white}
.edit-btn-tool{padding:5px 12px;border-radius:20px;border:1px solid #f6ad55;background:transparent;color:#f6ad55;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.edit-btn-tool:hover{background:#f6ad55;color:white}
.export-btn{padding:5px 12px;border-radius:20px;border:1px solid #48bb78;background:transparent;color:#48bb78;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.export-btn:hover{background:#48bb78;color:white}
.pdf-btn{padding:5px 12px;border-radius:20px;border:1px solid #f687b3;background:transparent;color:#f687b3;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.pdf-btn:hover{background:#f687b3;color:white}
.stat{margin-left:auto;font-size:12px;color:#718096;white-space:nowrap}
.stat span{color:#4299e1;font-weight:700}
#map{flex:1;min-height:0}
.map-wrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.legend{position:absolute;bottom:24px;right:12px;background:rgba(15,22,35,.92);border:1px solid #2a3550;border-radius:10px;padding:12px 14px;z-index:1000;font-size:12px}
.legend h4{font-size:10px;color:#718096;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
.leg-item{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.leg-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.my-popup{font-family:'Sarabun',sans-serif;min-width:220px}
.pop-location{font-size:12px;font-weight:700;color:#4299e1;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #e2e8f0}
.pop-unit{padding:8px 0;border-bottom:1px solid #f0f0f0}
.pop-unit:last-child{border-bottom:none;padding-bottom:0}
.pop-code{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;margin-bottom:6px}
.pop-name{font-size:14px;font-weight:700;color:#1a202c;margin-bottom:6px}
.pop-row{font-size:12px;color:#4a5568;margin-bottom:3px}
.pop-row strong{color:#2d3748}
.pop-row a{color:#3182ce;text-decoration:none}
.size-badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 9px;border-radius:20px;margin-left:6px;vertical-align:middle}
.size-S{background:#e6fffa;color:#2c7a7b}
.size-M{background:#fefcbf;color:#975a16}
.size-L{background:#fed7aa;color:#c05621}
.size-XL{background:#fed7d7;color:#c53030}
.divider{width:1px;height:22px;background:#3a4060;flex-shrink:0;margin:0 2px}
.size-btn{padding:5px 12px;border-radius:20px;border:1px solid #3a4060;background:transparent;color:#a0aec0;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.size-btn:hover{border-color:#718096;color:white}
.size-btn.active{color:white;border-color:transparent}
.size-btn[data-size="all"].active{background:#4a5568}
.size-btn[data-size="S"].active{background:#2c7a7b}
.size-btn[data-size="M"].active{background:#975a16}
.size-btn[data-size="L"].active{background:#c05621}
.size-btn[data-size="XL"].active{background:#c53030}
.pop-coords{font-size:10px;color:#a0aec0;margin:4px 0}
.pop-link{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:5px 14px;background:#4299e1;color:white;border-radius:20px;font-size:12px;text-decoration:none}
.pop-link:hover{background:#2b6cb0}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:3000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#1e2433;border:1px solid #3a4060;border-radius:14px;padding:24px 24px 20px;width:420px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);color:white}
.modal h2{font-size:15px;font-weight:700;margin-bottom:18px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:11px;color:#a0aec0;margin-bottom:4px}
.form-row input,.form-row select{width:100%;padding:7px 11px;background:#2d3550;border:1px solid #3a4060;border-radius:8px;color:white;font-family:'Sarabun',sans-serif;font-size:13px;outline:none}
.form-row input:focus,.form-row select:focus{border-color:#4299e1}
.form-row input::placeholder{color:#718096}
.form-row select option{background:#2d3550}
.form-row .hint{font-size:10px;color:#718096;margin-top:3px}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.btn-primary{flex:1;padding:9px;border-radius:8px;background:#4299e1;border:none;color:white;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.btn-primary:hover{background:#3182ce}
.btn-cancel{padding:9px 16px;border-radius:8px;background:transparent;border:1px solid #3a4060;color:#a0aec0;font-family:'Sarabun',sans-serif;font-size:13px;cursor:pointer}
.btn-cancel:hover{border-color:#718096;color:white}
.mgmt-list{max-height:340px;overflow-y:auto}
.mgmt-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #2d3550}
.mgmt-item:last-child{border-bottom:none}
.mgmt-item:hover{background:#2d3550;border-radius:8px}
.mgmt-info{flex:1;min-width:0}
.mgmt-code{font-size:11px;font-weight:700}
.mgmt-name{font-size:11px;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgmt-qa{font-size:10px;color:#718096}
.mgmt-actions{display:flex;gap:5px;flex-shrink:0}
.btn-edit-sm{padding:3px 9px;border-radius:5px;background:transparent;border:1px solid #f6ad55;color:#f6ad55;font-size:11px;cursor:pointer}
.btn-edit-sm:hover{background:#f6ad55;color:white}
.btn-del-sm{padding:3px 9px;border-radius:5px;background:transparent;border:1px solid #fc8181;color:#fc8181;font-size:11px;cursor:pointer}
.btn-del-sm:hover{background:#fc8181;color:white}
.mgmt-search{width:100%;padding:7px 11px;margin-bottom:10px;background:#2d3550;border:1px solid #3a4060;border-radius:8px;color:white;font-family:'Sarabun',sans-serif;font-size:12px;outline:none}
.mgmt-search:focus{border-color:#4299e1}
.mgmt-search::placeholder{color:#718096}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2d3748;color:white;padding:9px 20px;border-radius:20px;font-size:12px;font-family:'Sarabun',sans-serif;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.save-indicator{position:fixed;top:12px;right:12px;background:#2d4a2d;border:1px solid #48bb78;border-radius:20px;padding:4px 12px;font-size:11px;color:#48bb78;z-index:9998;opacity:0;transition:opacity .3s;pointer-events:none}
.save-indicator.show{opacity:1}
</style>
</head>
<body>
<div class="header">
  <div class="header-icon">🗺️</div>
  <div><div class="header-title">แผนที่หน่วยงาน QA</div><div class="header-sub">คลิกหมุดเพื่อดูรายละเอียด</div></div>
  <div class="hbadge" id="totalBadge">— จุด</div>
</div>
<div class="toolbar">
  <button class="qa-btn active" data-qa="all"     onclick="filterQA('all')">ทั้งหมด</button>
  <button class="qa-btn"        data-qa="Qa1"     onclick="filterQA('Qa1')">Qa1</button>
  <button class="qa-btn"        data-qa="Qa2"     onclick="filterQA('Qa2')">Qa2</button>
  <button class="qa-btn"        data-qa="Qa3"     onclick="filterQA('Qa3')">Qa3</button>
  <button class="qa-btn"        data-qa="Ecs"     onclick="filterQA('Ecs')">Ecs</button>
  <button class="qa-btn"        data-qa="Qa4"     onclick="filterQA('Qa4')">Qa4</button>
  <button class="qa-btn"        data-qa="Qa5"     onclick="filterQA('Qa5')">Qa5</button>
   <button class="qa-btn"        data-qa="Qa6"     onclick="filterQA('Qa6')">Qa6</button>
  <button class="qa-btn"        data-qa="แรงงาน"  onclick="filterQA('แรงงาน')">แรงงาน</button>
  <div class="divider"></div>
  <button class="size-btn active" data-size="all" onclick="filterSize('all')">ทุกขนาด</button>
  <button class="size-btn" data-size="S"  onclick="filterSize('S')">S <span style="font-size:10px;opacity:.7">1-5</span></button>
  <button class="size-btn" data-size="M"  onclick="filterSize('M')">M <span style="font-size:10px;opacity:.7">6-15</span></button>
  <button class="size-btn" data-size="L"  onclick="filterSize('L')">L <span style="font-size:10px;opacity:.7">16-30</span></button>
  <button class="size-btn" data-size="XL" onclick="filterSize('XL')">XL <span style="font-size:10px;opacity:.7">31+</span></button>
  <div class="divider"></div>
  <div class="search-wrap" id="searchWrap">
    <input type="text" id="searchInput" placeholder="ค้นหารหัส / ชื่อหน่วยงาน..." oninput="onSearch(this.value)" autocomplete="off">
    <span class="search-icon">🔍</span>
    <div class="search-results" id="searchResults"></div>
  </div>
  <button class="add-btn"       onclick="openAddModal()">＋ เพิ่ม</button>
  <button class="edit-btn-tool" onclick="openMgmtModal()">✏️ แก้ไข / ลบ</button>
  <button class="export-btn"    onclick="exportHTML()">⬇ Export</button>
  <button class="pdf-btn"       onclick="exportPDF()">📄 PDF</button>
  <div class="stat">แสดง <span id="cnt">—</span> หมุด  |  🧹 <span id="staffCnt">—</span> คน</div>
</div>
<div id="loadingOverlay" style="position:fixed;inset:0;background:#0f1623;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px"><div style="font-size:32px">🔥</div><div style="color:#4299e1;font-size:15px;font-family:Sarabun,sans-serif;font-weight:700">กำลังโหลดข้อมูล...</div></div>
<div class="map-wrap">
  <div id="map"></div>
  <div class="legend">
    <h4>QA ผู้รับผิดชอบ</h4>
    <div class="leg-item"><div class="leg-dot" style="background:#d69e2e"></div>Qa1</div>
    <div class="leg-item"><div class="leg-dot" style="background:#38a169"></div>Qa2</div>
    <div class="leg-item"><div class="leg-dot" style="background:#3182ce"></div>Qa3</div>
    <div class="leg-item"><div class="leg-dot" style="background:#805ad5"></div>Ecs</div>
    <div class="leg-item"><div class="leg-dot" style="background:#dd6b20"></div>แรงงาน</div>
    <div class="leg-item"><div class="leg-dot" style="background:#e53e3e"></div>Qa4</div>
    <div class="leg-item"><div class="leg-dot" style="background:#d53f8c"></div>Qa5</div>
    <div class="leg-item"><div class="leg-dot" style="background:#00b5d8"></div>Qa6</div>
  </div>
</div>

<div class="modal-overlay" id="addModal" onclick="if(event.target===this)closeModal('addModal')">
  <div class="modal">
    <h2>➕ เพิ่มหน่วยงานใหม่</h2>
    <div class="form-row"><label>รหัส *</label><input type="text" id="a_code" placeholder="เช่น C999"></div>
    <div class="form-row"><label>ชื่อหน่วยงาน *</label><input type="text" id="a_name"></div>
    <div class="form-row"><label>QA *</label>
      <select id="a_qa"><option value="Qa1">Qa1</option><option value="Qa2">Qa2</option><option value="Qa3">Qa3</option><option value="Qa4">Qa4</option><option value="Qa5">Qa5</option><option value="Qa6">Qa6</option><option value="Ecs">Ecs</option><option value="แรงงาน">แรงงาน</option></select></div>
    <div class="form-row"><label>จำนวนแม่บ้าน</label><input type="number" id="a_count" placeholder="0" min="0"></div>
    <div class="form-row"><label>Latitude *</label><input type="text" id="a_lat" placeholder="13.756000"><div class="hint">ตัวเลขแรกหลัง @ ใน Google Maps URL</div></div>
    <div class="form-row"><label>Longitude *</label><input type="text" id="a_lng" placeholder="100.548000"></div>
    <div class="form-row"><label>ลิงก์ Google Maps</label><input type="text" id="a_link" placeholder="https://maps.app.goo.gl/..."></div>
    <div class="form-row"><label>หัวหน้างาน</label><input type="text" id="a_supervisor"></div>
    <div class="form-row"><label>เบอร์หัวหน้างาน</label><input type="text" id="a_supervisorPhone" placeholder="0812345678"></div>
    <div class="form-row"><label>ชื่อลูกค้า</label><input type="text" id="a_clientName"></div>
    <div class="form-row"><label>เบอร์ลูกค้า</label><input type="text" id="a_clientPhone" placeholder="0812345678"></div>
    <div class="form-row"><label>หมายเหตุ</label><input type="text" id="a_note"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('addModal')">ยกเลิก</button>
      <button class="btn-primary" onclick="submitAdd()">✅ เพิ่มหมุด</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="mgmtModal" onclick="if(event.target===this)closeModal('mgmtModal')">
  <div class="modal">
    <h2>✏️ แก้ไข / ลบ</h2>
    <input class="mgmt-search" id="mgmtSearch" type="text" placeholder="🔍 ค้นหา..." oninput="renderMgmtList(this.value)">
    <div class="mgmt-list" id="mgmtList"></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal('mgmtModal')">ปิด</button></div>
  </div>
</div>

<div class="modal-overlay" id="editDetailModal" onclick="if(event.target===this)closeModal('editDetailModal')">
  <div class="modal">
    <h2>✏️ แก้ไขหน่วยงาน</h2>
    <input type="hidden" id="e_mi"><input type="hidden" id="e_ui">
    <div class="form-row"><label>รหัส</label><input type="text" id="e_code"></div>
    <div class="form-row"><label>ชื่อหน่วยงาน</label><input type="text" id="e_name"></div>
    <div class="form-row"><label>QA</label>
      <select id="e_qa"><option value="Qa1">Qa1</option><option value="Qa2">Qa2</option><option value="Qa3">Qa3</option><option value="Qa4">Qa4</option><option value="Qa5">Qa5</option><option value="Qa6">Qa6</option><option value="Ecs">Ecs</option><option value="แรงงาน">แรงงาน</option></select></div>
    <div class="form-row"><label>จำนวนแม่บ้าน</label><input type="number" id="e_count" min="0"></div>
    <div class="form-row"><label>Latitude</label><input type="text" id="e_lat"><div class="hint">⚠️ แก้จะย้ายหมุด</div></div>
    <div class="form-row"><label>Longitude</label><input type="text" id="e_lng"></div>
    <div class="form-row"><label>ลิงก์ Google Maps</label><input type="text" id="e_link"></div>
    <div class="form-row"><label>หัวหน้างาน</label><input type="text" id="e_supervisor"></div>
    <div class="form-row"><label>เบอร์หัวหน้างาน</label><input type="text" id="e_supervisorPhone"></div>
    <div class="form-row"><label>ชื่อลูกค้า</label><input type="text" id="e_clientName"></div>
    <div class="form-row"><label>เบอร์ลูกค้า</label><input type="text" id="e_clientPhone"></div>
    <div class="form-row"><label>หมายเหตุ</label><input type="text" id="e_note"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('editDetailModal');openMgmtModal()">ยกเลิก</button>
      <button class="btn-primary" onclick="submitEdit()">💾 บันทึก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="save-indicator" id="saveInd">💾 บันทึกแล้ว</div>

<script>
const QA_COLOR   = {Qa1:"#d69e2e",Qa2:"#38a169",Qa3:"#3182ce",Ecs:"#805ad5","แรงงาน":"#dd6b20",Qa4:"#e53e3e",Qa5:"#d53f8c",Qa6:"#00b5d8"};
const QA_CODE_BG = {Qa1:"#fefcbf",Qa2:"#f0fff4",Qa3:"#ebf8ff",Ecs:"#faf5ff","แรงงาน":"#fffaf0",Qa4:"#fff5f5",Qa5:"#fff0f6",Qa6:"#00b5d8"};

// ── ประกาศตัวแปรทั้งหมดไว้ด้านบนสุด เพื่อป้องกัน Error "before initialization" ──
const searchIndex = [];
const markers = [];
let activeQAs  = new Set(['all']);
let activeSizes = new Set(['all']);

// ── DATA ──────────────────────────────────────────────────
const DATA = [
];

// ═══════════════════════════════════════════════
// AUTO-SAVE: ปรับปรุงใหม่ บันทึกแค่ลงเครื่องเท่านั้น (กันโควต้าคลาวด์เต็ม)
// ═══════════════════════════════════════════════
const STORAGE_KEY = 'qa_map_v4_' + encodeURIComponent(window.location.pathname);

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); } catch(e) {}
  const ind = document.getElementById('saveInd');
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 1500);
}

// ── Map init ──────────────────────────────────────────────
const map = L.map('map').setView([13.76, 100.5], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);

function getSizeFromCount(count) {
  const n = count || 0;
  if (n <= 5)  return 'S';
  if (n <= 15) return 'M';
  if (n <= 30) return 'L';
  return 'XL';
}

function makeIcon(color, size) {
  const label = size || '';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36">'
    + '<path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z" fill="' + color + '" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>'
    + '<circle cx="12" cy="12" r="6" fill="white" opacity="0.9"/>'
    + (label ? '<text x="12" y="16" text-anchor="middle" font-size="7" font-weight="bold" font-family="Arial" fill="' + color + '">' + label + '</text>' : '')
    + '</svg>';
  return L.divIcon({className:'',html:svg,iconSize:[24,36],iconAnchor:[12,36],popupAnchor:[0,-36]});
}

function makeIconForData(d) {
  let count = 0;
  if (d.units) d.units.forEach(u => count += (u.count||0));
  else count = d.count || 0;
  const color = QA_COLOR[d.units ? d.units[0].qa : d.qa] || '#666';
  const size  = getSizeFromCount(count);
  return makeIcon(color, size);
}

function renderUnit(u, showCoords) {
  const bg = QA_CODE_BG[u.qa] || '#f0f0f0';
  return '<div class="pop-unit">'
    + '<span class="pop-code" style="background:' + bg + ';color:#2d3748">' + (u.code||'') + '</span>'
    + '<div class="pop-name">' + (u.name||'') + '</div>'
    + '<div class="pop-row">👤 <strong>' + (u.qa||'') + '</strong></div>'
    + '<div class="pop-row">🧹 แม่บ้าน <strong>' + (u.count||0) + ' คน</strong><span class="size-badge size-' + getSizeFromCount(u.count) + '">' + getSizeFromCount(u.count) + '</span></div>'
    + (u.supervisor ? '<div class="pop-row">👷 หัวหน้า <strong>' + u.supervisor + '</strong>' + (u.supervisorPhone ? ' <a href="tel:' + u.supervisorPhone + '">' + u.supervisorPhone + '</a>' : '') + '</div>' : '')
    + (u.clientName ? '<div class="pop-row">🏢 ลูกค้า <strong>' + u.clientName + '</strong>' + (u.clientPhone ? ' <a href="tel:' + u.clientPhone + '">' + u.clientPhone + '</a>' : '') + '</div>' : '')
    + (u.note ? '<div class="pop-row">📝 <em>' + u.note + '</em></div>' : '')
    + (showCoords ? '<div class="pop-coords">📌 ' + (u.lat||'') + ', ' + (u.lng||'') + '</div>' : '')
    + (u.link ? '<a class="pop-link" href="' + u.link + '" target="_blank">📍 Google Maps</a>' : '')
    + '</div>';
}

function buildMarkers() {
  // ลบ marker เก่าออกก่อน
  markers.forEach(m => { try { map.removeLayer(m); } catch(e){} });
  markers.length = 0;

  DATA.forEach(d => {
    let m;
    if (d.units) {
      m = L.marker([d.lat, d.lng], {icon: makeIconForData(d)});
      m.bindPopup('<div class="my-popup"><div class="pop-location">📍 ' + d.units.length + ' หน่วยงานในพิกัดนี้</div>' + d.units.map(u=>renderUnit(u,false)).join('') + '</div>', {maxWidth:320});
      m._qaList = d.units.map(u => u.qa);
    } else {
      m = L.marker([d.lat, d.lng], {icon: makeIconForData(d)});
      m.bindPopup('<div class="my-popup">' + renderUnit(Object.assign({},d), true) + '</div>', {maxWidth:300});
      m._qaList = [d.qa];
    }
    m._raw = d;
    let _cnt = 0;
    if (d.units) d.units.forEach(u => _cnt += (u.count||0)); else _cnt = d.count||0;
    m._size = getSizeFromCount(_cnt);
    m.addTo(map);
    markers.push(m);
  });

  document.getElementById('totalBadge').textContent = markers.length + ' จุด';
  rebuildSearchIndex();
  updateCount();
}

// สร้าง markers ครั้งแรก
buildMarkers();

// expose ให้ Firebase ใช้ rebuildMarkers
window.rebuildMarkers = buildMarkers;

// ── เพิ่มปุ่ม แก้ไข/ลบ เข้าไปในป็อปอัปของหมุด (แก้ข้อมูลตรงหมุดได้เลย) ──
map.on('popupopen', function(e) {
  const marker = e.popup._source;
  if (!marker || !marker._raw) return;
  const d = marker._raw;
  const el = e.popup.getElement();
  if (!el) return;
  el.querySelectorAll('.pop-unit').forEach(unitEl => {
    if (unitEl.querySelector('.pop-edit-actions')) return;          // กันเพิ่มซ้ำ
    const codeEl = unitEl.querySelector('.pop-code');
    const code = codeEl ? codeEl.textContent.trim() : '';
    const findUi = () => d.units ? d.units.findIndex(u => u.code === code) : -1;

    const actions = document.createElement('div');
    actions.className = 'pop-edit-actions';
    actions.style.cssText = 'margin-top:8px;display:flex;gap:6px';

    const bEdit = document.createElement('button');
    bEdit.textContent = '✏️ แก้ไข';
    bEdit.style.cssText = 'flex:1;padding:5px;border:none;background:#f6ad55;color:#fff;border-radius:6px;font-family:Sarabun,sans-serif;font-size:12px;font-weight:700;cursor:pointer';
    bEdit.addEventListener('click', () => {
      const mi = markers.indexOf(marker);                          // หาตำแหน่งสดๆ ตอนคลิก
      if (mi < 0) { showToast('⚠️ ไม่พบหน่วยงาน'); return; }
      map.closePopup();
      openEditDetail(mi, findUi());
    });

    const bDel = document.createElement('button');
    bDel.textContent = '🗑 ลบ';
    bDel.style.cssText = 'padding:5px 12px;border:1px solid #fc8181;background:#fff;color:#e53e3e;border-radius:6px;font-family:Sarabun,sans-serif;font-size:12px;font-weight:700;cursor:pointer';
    bDel.addEventListener('click', () => {
      const mi = markers.indexOf(marker);
      if (mi < 0) { showToast('⚠️ ไม่พบหน่วยงาน'); return; }
      if (!confirm('ยืนยันลบ ' + code + ' ?')) return;
      map.closePopup();
      deleteUnit(mi, findUi());
    });

    actions.appendChild(bEdit);
    actions.appendChild(bDel);
    unitEl.appendChild(actions);
  });
});

// ── Filter ────────────────────────────────────────────────
function filterSize(size) {
  if (size === 'all') {
    activeSizes = new Set(['all']);
  } else {
    activeSizes.delete('all');
    if (activeSizes.has(size)) { activeSizes.delete(size); if (!activeSizes.size) activeSizes = new Set(['all']); }
    else activeSizes.add(size);
  }
  document.querySelectorAll('.size-btn').forEach(b => {
    if (b.dataset.size === 'all') b.classList.toggle('active', activeSizes.has('all'));
    else b.classList.toggle('active', !activeSizes.has('all') && activeSizes.has(b.dataset.size));
  });
  markers.forEach(m => {
    const qaOk   = activeQAs.has('all') || m._qaList.some(q => activeQAs.has(q));
    const sizeOk = activeSizes.has('all') || activeSizes.has(m._size);
    qaOk && sizeOk ? m.addTo(map) : map.removeLayer(m);
  });
  updateCount();
}

function filterQA(qa) {
  if (qa === 'all') {
    activeQAs = new Set(['all']);
  } else {
    activeQAs.delete('all');
    if (activeQAs.has(qa)) { activeQAs.delete(qa); if (!activeQAs.size) activeQAs = new Set(['all']); }
    else activeQAs.add(qa);
  }
  document.querySelectorAll('.qa-btn').forEach(b => {
    if (b.dataset.qa === 'all') b.classList.toggle('active', activeQAs.has('all'));
    else b.classList.toggle('active', !activeQAs.has('all') && activeQAs.has(b.dataset.qa));
  });
  markers.forEach(m => {
    const qaOk   = activeQAs.has('all') || m._qaList.some(q => activeQAs.has(q));
    const sizeOk = activeSizes.has('all') || activeSizes.has(m._size);
    qaOk && sizeOk ? m.addTo(map) : map.removeLayer(m);
  });
  const fqa = activeQAs.has('all') || activeQAs.size > 1 ? 'all' : [...activeQAs][0];
  refreshPopups(fqa);
  updateCount();
}

function refreshPopups(qa) {
  markers.forEach(m => {
    const d = m._raw;
    if (d.units) {
      const vis = qa === 'all' ? d.units : d.units.filter(u => u.qa === qa);
      const pop = vis.length > 1
        ? '<div class="my-popup"><div class="pop-location">📍 ' + vis.length + ' หน่วยงานในพิกัดนี้</div>' + vis.map(u=>renderUnit(u,false)).join('') + '</div>'
        : '<div class="my-popup">' + renderUnit(vis[0]||d.units[0], false) + '</div>';
      m.bindPopup(pop, {maxWidth:320});
      m.setIcon(makeIconForData(d));
    } else {
      m.bindPopup('<div class="my-popup">' + renderUnit(Object.assign({},d), true) + '</div>', {maxWidth:300});
      m.setIcon(makeIconForData(d));
    }
  });
}

function updateCount() {
  const vis = markers.filter(m => map.hasLayer(m));
  document.getElementById('cnt').textContent = vis.length;
  let total = 0;
  
  vis.forEach(m => {
    const d = m._raw;
    if (d.units) {
      d.units.forEach(u => { 
        if (activeQAs.has('all') || activeQAs.has(u.qa)) {
          total += parseInt(u.count) || 0; 
        }
      });
    } else {
      total += parseInt(d.count) || 0;
    }
  });
  
  document.getElementById('staffCnt').textContent = total.toLocaleString();
}

// ── Search ────────────────────────────────────────────────
function rebuildSearchIndex() {
  searchIndex.length = 0;
  markers.forEach((m,mi) => {
    const d = m._raw;
    if (d.units) d.units.forEach(u => searchIndex.push({code:u.code,name:u.name,qa:u.qa,mi}));
    else searchIndex.push({code:d.code,name:d.name,qa:d.qa,mi});
  });
}

function onSearch(val) {
  const box = document.getElementById('searchResults');
  if (!val.trim()) { box.innerHTML=''; box.style.display='none'; return; }
  const q = val.toLowerCase();
  const hits = searchIndex.filter(s => (s.code||'').toLowerCase().includes(q)||(s.name||'').toLowerCase().includes(q)).slice(0,10);
  if (!hits.length) { box.innerHTML='<div class="search-item" style="color:#718096">ไม่พบ</div>'; box.style.display='block'; return; }
  box.innerHTML = hits.map(s =>
    '<div class="search-item" onclick="jumpTo(' + s.mi + ')">'
    + '<div class="si-code" style="color:' + (QA_COLOR[s.qa]||'#999') + '">' + (s.code||'') + '</div>'
    + '<div class="si-name">' + (s.name||'') + '</div>'
    + '</div>'
  ).join('');
  box.style.display = 'block';
}

function jumpTo(mi) {
  document.getElementById('searchResults').style.display='none';
  document.getElementById('searchInput').value='';
  const m = markers[mi];
  if (!map.hasLayer(m)) filterQA('all');
  map.setView(m.getLatLng(), 16, {animate:true});
  setTimeout(() => m.openPopup(), 400);
}

document.addEventListener('click', e => {
  if (!document.getElementById('searchWrap').contains(e.target))
    document.getElementById('searchResults').style.display='none';
});

// ── Modal ─────────────────────────────────────────────────
function openAddModal()  { document.getElementById('addModal').classList.add('open'); }
function openMgmtModal() { document.getElementById('mgmtSearch').value=''; renderMgmtList(''); document.getElementById('mgmtModal').classList.add('open'); }
function closeModal(id)  { document.getElementById(id).classList.remove('open'); }
function showToast(msg)  { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

function getExtra(p) {
  const g = id => (document.getElementById(id)||{value:''}).value.trim();
  return { supervisor:g(p+'_supervisor'), supervisorPhone:g(p+'_supervisorPhone'), clientName:g(p+'_clientName'), clientPhone:g(p+'_clientPhone'), note:g(p+'_note') };
}
function setExtra(p, u) {
  document.getElementById(p+'_supervisor').value      = u.supervisor||'';
  document.getElementById(p+'_supervisorPhone').value = u.supervisorPhone||'';
  document.getElementById(p+'_clientName').value      = u.clientName||'';
  document.getElementById(p+'_clientPhone').value     = u.clientPhone||'';
  document.getElementById(p+'_note').value            = u.note||'';
}

}

// ── เพิ่ม ─────────────────────────────────────────────────
function submitAdd() {
  const code  = document.getElementById('a_code').value.trim();
  const name  = document.getElementById('a_name').value.trim();
  const qa    = document.getElementById('a_qa').value;
  const count = parseInt(document.getElementById('a_count').value)||0;
  const lat   = parseFloat(document.getElementById('a_lat').value);
  const lng   = parseFloat(document.getElementById('a_lng').value);
  const link  = document.getElementById('a_link').value.trim();
  if (!code||!name||isNaN(lat)||isNaN(lng)) { showToast('⚠️ กรอก รหัส ชื่อ Lat Lng ให้ครบ'); return; }
  const entry = Object.assign({qa,code,name,count,lat,lng,link}, getExtra('a'));
  DATA.push(entry);
  const m = L.marker([lat,lng],{icon:makeIconForData(entry)});
  m.bindPopup('<div class="my-popup">' + renderUnit(Object.assign({},entry), true) + '</div>',{maxWidth:300});
  m._raw=entry; m._qaList=[qa]; m._size=getSizeFromCount(entry.count); m.addTo(map); markers.push(m);
  rebuildSearchIndex();
  updateCount();
  document.getElementById('totalBadge').textContent = markers.length+' จุด';
  ['a_code','a_name','a_count','a_lat','a_lng','a_link'].forEach(id=>document.getElementById(id).value='');
  clearExtra('a');
  closeModal('addModal');
  map.setView([lat,lng],15,{animate:true}); setTimeout(()=>m.openPopup(),400);
  
  // ⭐️ อัปโหลดลง Firebase เฉพาะตัวที่เพิ่งเพิ่ม ⭐️
  if (window._fbReady && window._setDoc && window._docRef) {
    const key = (entry.code||'x').replace(/[^a-zA-Z0-9_-]/g,'_');
    entry._docId = key;
    window._setDoc(window._docRef('units', key), JSON.parse(JSON.stringify(entry))).catch(e => console.warn(e));
  }
  
  saveData();
  showToast('✅ เพิ่ม '+code+' แล้ว!');
}

// ── แก้ไข/ลบ ─────────────────────────────────────────────
function findUnitByCode(code) {
  for (let mi = 0; mi < markers.length; mi++) {
    const d = markers[mi]._raw;
    if (d.units) {
      for (let ui = 0; ui < d.units.length; ui++) {
        if (d.units[ui].code === code) return { mi, ui, m: markers[mi], d, u: d.units[ui] };
      }
    } else {
      if (d.code === code) return { mi, ui: -1, m: markers[mi], d, u: d };
    }
  }
  return null;
}

function renderMgmtList(q) {
  q = q.toLowerCase().trim();
  const items = [];
  markers.forEach((m, mi) => {
    const d = m._raw;
    if (d.units) d.units.forEach((u, ui) => items.push({ code:u.code, name:u.name, qa:u.qa, mi, ui }));
    else items.push({ code:d.code, name:d.name, qa:d.qa, mi, ui:-1 });
  });
  const filtered = q ? items.filter(i=>(i.code||'').toLowerCase().includes(q)||(i.name||'').toLowerCase().includes(q)) : items;
  const container = document.getElementById('mgmtList');
  if (!filtered.length) { container.innerHTML='<div style="padding:14px;color:#718096;text-align:center">ไม่พบข้อมูล</div>'; return; }
  container.innerHTML = filtered.map(i => {
    const c = QA_COLOR[i.qa]||'#999';
    return '<div class="mgmt-item">'
      + '<div class="mgmt-info">'
      + '<div class="mgmt-code" style="color:' + c + '">' + (i.code||'') + '</div>'
      + '<div class="mgmt-name">' + (i.name||'') + '</div>'
      + '<div class="mgmt-qa">' + (i.qa||'') + '</div>'
      + '</div>'
      + '<div class="mgmt-actions">'
      + '<button class="btn-edit-sm" onclick="openEditDetail(' + i.mi + ',' + i.ui + ')">✏️</button>'
      + '<button class="btn-del-sm"  onclick="deleteUnit(' + i.mi + ',' + i.ui + ')">🗑</button>'
      + '</div>'
      + '</div>';
  }).join('');
}

function openEditDetail(mi, ui) {
  const m = markers[mi];
  if (!m) { showToast('⚠️ ไม่พบข้อมูล'); return; }
  const d = m._raw;
  const u = ui === -1 ? d : (d.units ? d.units[ui] : d);
  if (!u) { showToast('⚠️ ไม่พบข้อมูล'); return; }
  document.getElementById('e_mi').value = mi;
  document.getElementById('e_ui').value = ui;
  document.getElementById('e_code').value  = u.code  || '';
  document.getElementById('e_name').value  = u.name  || '';
  document.getElementById('e_qa').value    = u.qa    || 'Qa1';
  document.getElementById('e_count').value = u.count || 0;
  document.getElementById('e_lat').value   = u.lat   || d.lat || '';
  document.getElementById('e_lng').value   = u.lng   || d.lng || '';
  document.getElementById('e_link').value  = u.link  || '';
  setExtra('e', u);
  closeModal('mgmtModal');
  const modal = document.getElementById('editDetailModal');
  modal.classList.add('open');
  setTimeout(() => { const m = modal.querySelector('.modal'); if(m) m.scrollTop = 0; }, 50);
}

function submitEdit() {
  const mi  = parseInt(document.getElementById('e_mi').value);
  const ui  = parseInt(document.getElementById('e_ui').value);

  const code  = document.getElementById('e_code').value.trim();
  const name  = document.getElementById('e_name').value.trim();
  const qa    = document.getElementById('e_qa').value;
  const count = parseInt(document.getElementById('e_count').value) || 0;
  const lat   = parseFloat(document.getElementById('e_lat').value);
  const lng   = parseFloat(document.getElementById('e_lng').value);
  const link  = document.getElementById('e_link').value.trim();
  const extra = getExtra('e');

  if (!code) { showToast('⚠️ กรุณากรอก รหัส'); document.getElementById('e_code').focus(); return; }
  if (!name) { showToast('⚠️ กรุณากรอก ชื่อหน่วยงาน'); document.getElementById('e_name').focus(); return; }
  if (isNaN(lat)) { showToast('⚠️ Latitude ไม่ถูกต้อง'); document.getElementById('e_lat').focus(); return; }
  if (isNaN(lng)) { showToast('⚠️ Longitude ไม่ถูกต้อง'); document.getElementById('e_lng').focus(); return; }

  if (isNaN(mi) || mi < 0 || mi >= markers.length) { showToast('⚠️ ไม่พบ marker กรุณาปิดแล้วเปิดใหม่'); return; }

  const m = markers[mi]; const d = m._raw;

  if (ui === -1) {
    Object.assign(d, {code, name, qa, count, lat, lng, link}, extra);
    m.setLatLng([lat,lng]); m.setIcon(makeIconForData(d)); m._qaList=[qa]; m._size=getSizeFromCount(d.count);
    m.bindPopup('<div class="my-popup">' + renderUnit(Object.assign({},d), true) + '</div>', {maxWidth:300});
  } else {
    Object.assign(d.units[ui], {code, name, qa, count, link}, extra);
    d.lat=lat; d.lng=lng; m.setLatLng([lat,lng]);
    m.setIcon(makeIconForData(d)); m._qaList=d.units.map(u=>u.qa);
    const pop = d.units.length > 1
      ? '<div class="my-popup"><div class="pop-location">📍 ' + d.units.length + ' หน่วยงาน</div>' + d.units.map(u=>renderUnit(u,false)).join('') + '</div>'
      : '<div class="my-popup">' + renderUnit(d.units[0], false) + '</div>';
    m.bindPopup(pop, {maxWidth:320});
  }

  if (window._fbReady && window._setDoc && window._docRef) {
    // เขียนทับ document id เดิม (ใช้ id จริงจาก Firestore กันคีย์คำนวณไม่ตรง → ไม่เกิด doc กำพร้า)
    const key = d._docId || (d.units
      ? 'multi_' + String(d.lat).replace(/[^0-9]/g,'') + String(d.lng).replace(/[^0-9]/g,'')
      : (d.code||'x').replace(/[^a-zA-Z0-9_-]/g,'_'));
    d._docId = key;
    window._setDoc(window._docRef('units', key), JSON.parse(JSON.stringify(d))).catch(e => console.warn(e));
  }

  rebuildSearchIndex();
  closeModal('editDetailModal');
  map.setView([lat,lng], 15, {animate:true});
  setTimeout(() => m.openPopup(), 400);
  saveData();
  showToast('💾 บันทึกแล้ว!');
}

function deleteUnit(mi, ui) {
  const m = markers[mi];
  if (!m) { showToast('⚠️ ไม่พบ marker'); return; }
  const d = m._raw;
  const code = ui === -1 ? d.code : (d.units ? d.units[ui].code : d.code);

  const removeFbDoc = (docKey) => {
    if (window._fbReady && window._deleteDoc && window._docRef) {
      window._deleteDoc(window._docRef('units', docKey)).catch(e => console.warn(e));
    }
  };

  // ใช้ document id จริงจาก Firestore ถ้ามี (กันคีย์คำนวณไม่ตรงกับของจริง → ลบไม่โดน)
  const groupDocId = d._docId || (d.units
    ? 'multi_' + String(d.lat).replace(/[^0-9]/g,'') + String(d.lng).replace(/[^0-9]/g,'')
    : (d.code||'x').replace(/[^a-zA-Z0-9_-]/g,'_'));

  if (ui === -1) {
    removeFbDoc(groupDocId);
    map.removeLayer(m); markers.splice(mi, 1);
    const idx = DATA.indexOf(d);
    if (idx > -1) DATA.splice(idx, 1);
    else { const fbIdx = DATA.findIndex(x => x.code === d.code); if (fbIdx > -1) DATA.splice(fbIdx, 1); }
  } else {
    d.units.splice(ui, 1);

    if (!d.units.length) {
      removeFbDoc(groupDocId);
      map.removeLayer(m); markers.splice(mi, 1);
      const idx = DATA.indexOf(d);
      if (idx > -1) DATA.splice(idx, 1);
      else { const fbIdx = DATA.findIndex(x => x.lat === d.lat && x.lng === d.lng); if (fbIdx > -1) DATA.splice(fbIdx, 1); }
    } else if (d.units.length === 1) {
      removeFbDoc(groupDocId);                 // ลบ doc กลุ่มเดิมทิ้ง
      const u = d.units[0]; Object.assign(d, u); delete d.units;
      m.setIcon(makeIconForData(d)); m._qaList=[d.qa]; m._size=getSizeFromCount(d.count);
      m.bindPopup('<div class="my-popup">' + renderUnit(Object.assign({},d), true) + '</div>', {maxWidth:300});
      if (window._fbReady && window._setDoc && window._docRef) {
        const newKey = (d.code||'x').replace(/[^a-zA-Z0-9_-]/g,'_');
        d._docId = newKey;                     // กลายเป็นหมุดเดี่ยว ใช้ id ใหม่
        window._setDoc(window._docRef('units', newKey), JSON.parse(JSON.stringify(d))).catch(e => console.warn(e));
      }
    } else {
      m.setIcon(makeIconForData(d)); m._qaList=d.units.map(u=>u.qa);
      m.bindPopup('<div class="my-popup"><div class="pop-location">📍 ' + d.units.length + ' หน่วยงาน</div>' + d.units.map(u=>renderUnit(u,false)).join('') + '</div>', {maxWidth:320});
      if (window._fbReady && window._setDoc && window._docRef) {
        window._setDoc(window._docRef('units', groupDocId), JSON.parse(JSON.stringify(d))).catch(e => console.warn(e));
      }
    }
  }
  
  rebuildSearchIndex(); updateCount();
  document.getElementById('totalBadge').textContent = markers.length + ' จุด';
  renderMgmtList(document.getElementById('mgmtSearch').value);
  saveData();
  showToast('🗑 ลบ ' + code + ' แล้ว');
}

// ── Export HTML ───────────────────────────────────────────
function esc(s) { return (s||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"'); }

function serializeData() {
  return 'const DATA = [\n' + DATA.map(d => {
    if (d.units) {
      const ul = d.units.map(u => {
        let s = '    { qa:"' + u.qa + '", code:"' + esc(u.code) + '", count:' + (u.count||0) + ', name:"' + esc(u.name) + '", link:"' + esc(u.link) + '"';
        if(u.supervisor)      s+=', supervisor:"' + esc(u.supervisor) + '"';
        if(u.supervisorPhone) s+=', supervisorPhone:"' + esc(u.supervisorPhone) + '"';
        if(u.clientName)      s+=', clientName:"' + esc(u.clientName) + '"';
        if(u.clientPhone)     s+=', clientPhone:"' + esc(u.clientPhone) + '"';
        if(u.note)            s+=', note:"' + esc(u.note) + '"';
        return s+' }';
      }).join(',\n');
      return '  {\n    lat:' + d.lat + ', lng:' + d.lng + ',\n    units:[\n' + ul + '\n    ]\n  }';
    }
    let s = '  { qa:"' + d.qa + '", code:"' + esc(d.code) + '", count:' + (d.count||0) + ', lat:' + d.lat + ', lng:' + d.lng + ', link:"' + esc(d.link) + '",\n    name:"' + esc(d.name) + '"';
    if(d.supervisor)      s+=', supervisor:"' + esc(d.supervisor) + '"';
    if(d.supervisorPhone) s+=', supervisorPhone:"' + esc(d.supervisorPhone) + '"';
    if(d.clientName)      s+=', clientName:"' + esc(d.clientName) + '"';
    if(d.clientPhone)     s+=', clientPhone:"' + esc(d.clientPhone) + '"';
    if(d.note)            s+=', note:"' + esc(d.note) + '"';
    return s+' }';
  }).join(',\n') + '\n];';
}

function exportHTML() {
  const newData = serializeData();
  fetch(window.location.href)
    .then(r => { if(!r.ok) throw new Error('fetch failed'); return r.text(); })
    .then(original => {
      const start = original.indexOf('const DATA = [');
      const end   = original.indexOf('\n];', start) + 3;
      if (start < 0) throw new Error('no DATA');
      const output = original.slice(0, start) + newData + original.slice(end);
      downloadFile(output, 'qa-map-updated.html');
      showToast('⬇ Export สำเร็จ!');
    })
    .catch(err => {
      console.error(err);
      showToast('⚠️ ต้องเปิดผ่าน localhost เพื่อ Export (ไม่ใช่ file://)');
    });
}

function downloadFile(content, filename) {
  const blob = new Blob([content], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ── Export PDF ────────────────────────────────────────────
function exportPDF() {
  const rows=[];
  markers.forEach(m => {
    if (!map.hasLayer(m)) return;
    const d = m._raw;
    if (d.units) d.units.forEach(u => { if(activeQAs.has('all')||activeQAs.has(u.qa)) rows.push({code:u.code,name:u.name||'',qa:u.qa,count:u.count||0,supervisor:u.supervisor||'',supervisorPhone:u.supervisorPhone||'',clientName:u.clientName||'',clientPhone:u.clientPhone||'',note:u.note||''}); });
    else rows.push({code:d.code,name:d.name||'',qa:d.qa,count:d.count||0,supervisor:d.supervisor||'',supervisorPhone:d.supervisorPhone||'',clientName:d.clientName||'',clientPhone:d.clientPhone||'',note:d.note||''});
  });
  if (!rows.length) { showToast('⚠️ ไม่มีข้อมูล'); return; }
  rows.sort((a,b)=>a.qa.localeCompare(b.qa)||a.code.localeCompare(b.code));
  const qaLabelMap = {Qa1:'พี่จุ๊ (Qa1)',Qa2:'พี่รุ่ง (Qa2)',Qa3:'Qa3',Qa4:'พี่เอก (Qa4)'};
  const qaLabel = activeQAs.has('all') ? 'ทั้งหมด' : [...activeQAs].map(q=>qaLabelMap[q]||q).join(', ');
  const total = rows.reduce((s,r)=>s+r.count,0);
  const today = new Date().toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'});
  const qaShort = {Qa1:"พี่จุ๊",Qa2:"พี่รุ่ง",Qa3:"Qa3",Qa4:"พี่เอก"};
  const trs = rows.map((r,i) => {

    return '<tr><td style="text-align:center;color:#718096">' + (i+1) + '</td>'
      + '<td style="font-family:monospace;font-weight:700">' + (r.code||'') + '</td>'
      + '<td>' + (r.name||'') + '</td>'
      + '<td style="text-align:center"><span style="background:' + c + '20;color:' + c + ';padding:1px 8px;border-radius:20px;font-size:10px;font-weight:700">' + (qaShort[r.qa]||r.qa) + '</span></td>'
      + '<td style="text-align:center">' + r.count + '</td>'
      + '<td>' + (r.supervisor||'') + '</td>'
      + '<td>' + (r.supervisorPhone||'') + '</td>'
      + '<td>' + (r.clientName||'') + '</td>'
      + '<td>' + (r.clientPhone||'') + '</td>'
      + '<td style="color:#718096">' + (r.note||'') + '</td></tr>';
  }).join('');

  const pdfParts = [
    '<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>รายงาน QA</title>',
    '<style>@import url(\'https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap\');',
    '*{margin:0;padding:0;box-sizing:border-box}body{font-family:\'Sarabun\',sans-serif;font-size:11px;color:#2d3748;padding:20px}',
    '.header{border-bottom:3px solid #2b6cb0;padding-bottom:10px;margin-bottom:12px}',
    '.header h1{font-size:16px;font-weight:700;color:#1a365d}.header .sub{font-size:10px;color:#718096;margin-top:2px}',
    '.summary{display:flex;gap:10px;margin-bottom:12px}.sbox{background:#f7fafc;border:1px solid #e2e8f0;border-radius:6px;padding:6px 14px}',
    '.sbox .lbl{font-size:10px;color:#718096}.sbox .val{font-size:14px;font-weight:700;color:#2b6cb0}',
    'table{width:100%;border-collapse:collapse}thead tr{background:#2b6cb0;color:white}',
    'thead th{padding:6px 8px;text-align:left;font-size:10px;font-weight:700}',
    'tbody tr:nth-child(even){background:#f7fafc}tbody td{padding:5px 8px;border-bottom:1px solid #e2e8f0;font-size:10px;vertical-align:top}',
    '.footer{margin-top:10px;text-align:right;font-size:9px;color:#a0aec0}',
    '@media print{body{padding:10px}thead{display:table-header-group}tr{page-break-inside:avoid}}',
    '</style></head><body>',
    '<div class="header"><h1>📋 รายงานหน่วยงาน QA</h1><div class="sub">QA: ' + qaLabel + ' | ' + today + '</div></div>',
    '<div class="summary">',
    '<div class="sbox"><div class="lbl">หน่วยงาน</div><div class="val">' + rows.length + ' แห่ง</div></div>',
    '<div class="sbox"><div class="lbl">🧹 แม่บ้านรวม</div><div class="val">' + total.toLocaleString() + ' คน</div></div>',
    '</div>',
    '<table><thead><tr>',
    '<th style="width:28px">#</th><th style="width:65px">รหัส</th><th>ชื่อหน่วยงาน</th>',
    '<th style="width:50px">QA</th><th style="width:55px">แม่บ้าน</th>',
    '<th style="width:90px">หัวหน้างาน</th><th style="width:85px">เบอร์หัวหน้า</th>',
    '<th style="width:90px">ลูกค้า</th><th style="width:85px">เบอร์ลูกค้า</th><th>หมายเหตุ</th>',
    '</tr></thead><tbody>' + trs + '</tbody></table>',
    '<div class="footer">แผนที่หน่วยงาน QA | ' + today + '</div>',
    '<scr' + 'ipt>window.onload=function(){window.print();}</' + 'script>',
    '</body></html>'
  ];
  const pdfHtml = pdfParts.join('');

  const blob = new Blob([pdfHtml], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.target = '_blank';
  a.click();
  showToast('📄 เปิดแล้ว กด Ctrl+P');
}

const firebaseConfig = {
  apiKey: "AIzaSyAc7_R3-9M5S3eNoJ7bzLfs4YGNFKi0yAU",
  authDomain: "qa-map-e3f27.firebaseapp.com",
  projectId: "qa-map-e3f27",
  storageBucket: "qa-map-e3f27.firebasestorage.app",
  messagingSenderId: "416522148616",
  appId: "1:416522148616:web:86b0452bb837cf09d2eabd"
};

window._fbReady = false;
window._setDoc  = null;
window._deleteDoc = null;
window._docRef  = null;

let _app, _db;
try {
  _app = initializeApp(firebaseConfig);
  _db  = getFirestore(_app);
  window._setDoc = (ref, data) => setDoc(ref, data);
  window._deleteDoc = (ref) => deleteDoc(ref);
  window._docRef = (name, id)  => doc(_db, name, id);
} catch(e) {
  console.warn('Firebase init failed:', e);
}

function hideLoading() {
  const ov = document.getElementById('loadingOverlay');
  if (ov) ov.style.display = 'none';
}

if (_db) {
  getDocs(collection(_db, 'units'))
    .then(snap => {
      if (!snap.empty) {
        DATA.length = 0;
        snap.forEach(docSnap => { const o = docSnap.data(); o._docId = docSnap.id; DATA.push(o); });
        console.log('✅ Firebase loaded:', DATA.length, 'items');
        if (typeof window.rebuildMarkers === 'function') window.rebuildMarkers();
      } else {
        console.log('📤 Uploading initial data...');
        DATA.forEach(d => {
          const key = d.units
            ? 'multi_' + String(d.lat).replace(/[^0-9]/g,'') + String(d.lng).replace(/[^0-9]/g,'')
            : (d.code||'x').replace(/[^a-zA-Z0-9_-]/g,'_');
          d._docId = key;
          setDoc(doc(_db, 'units', key), JSON.parse(JSON.stringify(d)));
        });
      }
    })
    .catch(e => console.warn('Firebase error:', e))
    .finally(() => {
      window._fbReady = true;
      hideLoading();
    });
} else {
  window._fbReady = true;
  hideLoading();
}
</script>
